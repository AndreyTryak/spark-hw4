# Managed by spark-hw4
# Spark on YARN (HW4). HDFS from HW1, YARN from HW2, Hive from HW3.
spark.master                         yarn
# client mode: the driver runs on edge (10.22.0.10), where the Metastore listens on 127.0.0.1 only
spark.submit.deployMode              client
spark.driver.host                    10.22.0.10
spark.driver.bindAddress             0.0.0.0
spark.driver.memory                  1g
spark.executor.instances             2
spark.executor.cores                 1
spark.executor.memory                512m
spark.executor.memoryOverhead        512m
spark.yarn.am.memory                 512m
# Spark jars are stored in HDFS (created by deploy.sh) instead of being uploaded on every run
spark.yarn.archive                   hdfs://10.22.0.11:9000/user/team/spark-hw4/spark-libs.jar
spark.eventLog.enabled               true
spark.eventLog.dir                   hdfs://10.22.0.11:9000/user/team/spark-hw4/events
spark.sql.warehouse.dir              hdfs://10.22.0.11:9000/user/team/spark-hw4/warehouse
spark.sql.shuffle.partitions         8
spark.sql.session.timeZone           UTC
# Parquet layout that Hive reads without surprises (decimal as fixed_len_byte_array)
spark.sql.parquet.writeLegacyFormat  true
spark.hadoop.hive.exec.dynamic.partition.mode  nonstrict
spark.sql.sources.partitionOverwriteMode       dynamic
# Hive client built into Spark 3.5 (2.3.9) talks to the HW3 Metastore over thrift (see hive-site.xml)
spark.sql.hive.metastore.version     2.3.9
spark.sql.hive.metastore.jars        builtin
